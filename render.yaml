services:
  - type: web
    name: job-tracker-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false   # set in Render dashboard, never in git
      - key: MCP_TOKEN
        sync: false
